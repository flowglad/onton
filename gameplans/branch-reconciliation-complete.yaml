    description: >-
      Context-bound forge observations, confirmed reversion, native restrictions and
      visible satisfied-pair waits.
    tracesTo:
      - FC-3
  - id: A19
    description: >-
      Recorded precedence, labelled inference, failed-probe retry and exhausted
      deterministic fallback.
    tracesTo:
      - FC-2
  - id: A20
    description: >-
      Deep stacks, retargeting, squash/rebase merges, changed patch IDs, multiple
      repairs and empty outcomes preserve expected trees.
    tracesTo:
      - FC-7
  - id: A21
    description: >-
      Every mutation/checkpoint boundary resumes equivalently without lost work,
      duplicate repair or unauthorized publication.
    tracesTo:
      - FC-1
      - FC-8
  - id: A22
    description: >-
      Dependent boundaries survive and eligible private refs are reclaimed without
      touching unrelated incarnations.
    tracesTo:
      - FC-4
  - id: A23
    description: >-
      Independent generated histories converge under explicit fairness assumptions and
      then settle.
    tracesTo:
      - FC-5
  - id: A24
    description: >-
      Polling, scheduled work, sessions, cancellation, root contributions and retries
      retain exclusive authority.
    tracesTo:
      - FC-1
  - id: M1-M2
    description: >-
      Preserve snapshot, publication, root integration, bounded repair, terminal
      scheduling and legacy recovery guarantees.
    tracesTo:
