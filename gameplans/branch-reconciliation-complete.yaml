      owner-mutation-failures s: OwnerState => Nat0.
      owner-dirty-local-work? s: OwnerState => Bool.
      owner-finish-work-next? s: OwnerState => Bool.
      owner-probe-failed? s: OwnerState => Bool.
      owner-diagnostic-turn? s: OwnerState => Bool.
      owner-retry? s: OwnerState => Bool.
      owner-no-progress-turns s: OwnerState => Nat0.
      owner-intervention? s: OwnerState => Bool.
      owner-publishes? s: OwnerState => Bool.
      owner-preservation-proved? s: OwnerState => Bool.
      owner-lease-bound? s: OwnerState => Bool.
