formatVersion: 3

projectName: branch-reconciliation-complete

owner: flowglad

repo: onton

specFile:

workstream:
  name: branch-reconciliation
  milestone: M3 — complete endpoint
  priorMilestones:
    - M1 — foundation
    - M2 — useful release
  unlocks: One extensible owner with the complete original reconciliation guarantees.

problemStatement: >-
  M3 must finish the complete branch-reconciliation design, including A18–A24 and
  preserved M1/M2 guarantees; passing a subset of tests does not establish the endpoint.

solutionSummary: >-
  Complete the existing pure owner and effect handlers, contextual forge acceptance,
  durable lifecycle boundaries, and independent qualification. The completion audit
  records acceptance decisions and final verification for the full milestone.

architectureDesign:
  summary: >-
    The workstream and AGENTS.md constrain pure decisions to onton_core and all Git
    mutation to the existing reconciliation owner. No new architecture decision is
    introduced here.
  decisions:
    - id: AD-1
      topic: authority and effects
      question: Who authorizes Git mutations?
      choice: >-
        Branch_reconcile owns decisions; durable runner dispatches effects under runtime
        and project leases.
      alternatives: []
      resolution:
        kind: constrained
        evidence: >-
          AGENTS.md pure decision modules and rebase-anchor lifecycle;
          docs/workstreams/branch-reconciliation.md M3 definition of done.
        rationale: >-
          The approved endpoint explicitly requires one owner, no competing mutation
          path and no feature flag.

mergabilityStrategy:
  featureFlagStrategy: No endpoint flag; every live path uses the existing owner.
  featureFlags: []
  patchOrderingStrategy: >-
    The atomic implementation cutover supplies all mutually dependent APIs and migrated
    consumers. Independent-model and endpoint qualification follows through the producer
    guarantees; shared test wiring is extended only after its sources exist.

currentStateAnalysis: >-
  The reopened M3 fallback boundary is locally qualified. Generic terminal result/event
  inputs and the gameplan-publication refusal are removed. Ordered obligations select
  deterministic work, full recovery or observation-only diagnosis; independent evidence
  and mutation budgets survive restart. Unexhausted historical stops are re-evaluated.
  Both reported deadlocks, remaining diagnostic routes, the independent model, the full
  regression suite, architecture gates and both isolated prefixes pass. No PR is open.

operationalConsiderations:
  externalSystemAccess: >-
    Existing GitHub and SourceHut adapters and Git remotes remain the external systems.
    Existing HTTPS/SSH credentials remain handler inputs; no new external service is
    introduced.
  crossRuntimeContracts: >-
    Runtime snapshots, owner command tokens, hook claims and integration/publication
    receipts survive process restart. Preserve v2 checkpoint semantics and reject
    unsupported snapshot versions rather than silently discarding evidence.
  failureBehavior: >-
    Repeated failed probes request diagnosis; permission failures receive bounded agent
    assistance; ambiguous command completion inspects captured state. Unknown hook
    outcomes require explicit resume. Infrastructure outages do not consume completed
    content-repair turns.
  concurrencyAndIdempotency: >-
    Runtime patch/root ownership serializes mutations; project kernel leases and drain
    guards outlive descendant processes. Tokens reject stale results; explicit leases
    bind publication; pruning compare-deletes captured tips while dependent owners are
    protected.
  rollbackStrategy: >-
    Keep snapshots and recovery refs intact. Revert code only to a binary that supports
    the persisted format; otherwise restore a compatible snapshot and inspect remote
    refs before any mutation. Never delete retained evidence or downgrade by stripping
    fields.

