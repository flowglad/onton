  forge-native-released? o: ForgeObservation => Bool.
  ---
  all o: ForgeObservation, forge-accepted? o | forge-identified? o and forge-current-ticket? o and forge-current-pr? o.
  all o: ForgeObservation, forge-accepted? o and forge-open? o | forge-current-base? o and forge-confirmed-head? o and forge-confirmed-base? o.
  all o: ForgeObservation, forge-accepted? o and forge-conflicting? o and forge-satisfied-pair? o | forge-visible-wait? o and ~forge-dispatch-repair? o.
  all o: ForgeObservation, forge-native-stack? o | ~forge-base-mutation? o.
  all o: ForgeObservation, forge-native-released? o | forge-absence-count o >= 2.
  all o: ForgeObservation, forge-dispatched? o | forge-ticket-durable? o.
  all o: ForgeObservation, forge-unresolved-conflict? o | ~forge-merge-authorized? o.

  where

  LifeState.
  life-mutate? s: LifeState => Bool.
  life-writer-held? s: LifeState => Bool.
  life-old-tree-live? s: LifeState => Bool.
  life-admit-writer? s: LifeState => Bool.
  life-hook-dispatch? s: LifeState => Bool.
  life-hook-claim-durable? s: LifeState => Bool.
  life-hook-context-matches? s: LifeState => Bool.
  life-hook-completed? s: LifeState => Bool.
  life-hook-unknown? s: LifeState => Bool.
  life-explicit-resume? s: LifeState => Bool.
  life-prune? s: LifeState => Bool.
  life-required-revisions s: LifeState => [String].
  life-protected-revisions s: LifeState => [String].
  life-retiring-payload s: LifeState => String.
  life-deleted-payload s: LifeState => String.
  life-delete-payload? s: LifeState => Bool.
  ---
  all s: LifeState, life-mutate? s | life-writer-held? s.
  all s: LifeState, life-old-tree-live? s | ~life-admit-writer? s.
  all s: LifeState, life-hook-dispatch? s | life-hook-claim-durable? s and life-hook-context-matches? s and ~life-hook-completed? s.
  all s: LifeState, life-hook-unknown? s and ~life-explicit-resume? s | ~life-hook-dispatch? s.
  all s: LifeState, life-prune? s | life-required-revisions s subset life-protected-revisions s.
  all s: LifeState, life-delete-payload? s | life-deleted-payload s = life-retiring-payload s.

  where

  ModelRun.
  model-writes-cease? r: ModelRun => Bool.
  model-services-return? r: ModelRun => Bool.
  model-repairs-succeed? r: ModelRun => Bool.
  model-fresh-observation? r: ModelRun => Bool.
  model-finite-work? r: ModelRun => Bool.
  model-commands-serviced? r: ModelRun => Bool.
  model-required-resumes-authorized? r: ModelRun => Bool.
  model-fair? r: ModelRun => Bool.
  model-settles? r: ModelRun => Bool.
  model-restart-equivalent? r: ModelRun => Bool.
  model-compatible-orders-equivalent? r: ModelRun => Bool.
  model-compatible-observations? r: ModelRun => Bool.
  model-owned-mutations-only? r: ModelRun => Bool.
  model-content-budget-before r: ModelRun => Nat0.
  model-content-budget-after r: ModelRun => Nat0.
  model-infrastructure-only? r: ModelRun => Bool.
  ---
  all r: ModelRun | model-fair? r <-> (model-writes-cease? r and model-services-return? r and model-repairs-succeed? r and model-fresh-observation? r and model-finite-work? r and model-commands-serviced? r and model-required-resumes-authorized? r).
  all r: ModelRun, model-fair? r | model-settles? r.
  all r: ModelRun | model-restart-equivalent? r and model-owned-mutations-only? r.
  all r: ModelRun, model-compatible-observations? r | model-compatible-orders-equivalent? r.
  all r: ModelRun, model-infrastructure-only? r | model-content-budget-after r = model-content-budget-before r.
