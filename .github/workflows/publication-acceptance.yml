name: Git reconciliation acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Real Git publication and checkpoint races
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v4
      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: '5.5.0'
          dune-cache: true
      - name: Install dependencies
        run: |
          opam option 'archive-mirrors=["https://opam.ocaml.org/cache"]'
          opam install . --deps-only --with-test -y < /dev/null
      - name: Run isolated Git publication acceptance
        timeout-minutes: 30
        run: |
          set -o pipefail
          timeout 25m opam exec -- dune build @publication-acceptance @reconciliation-checkpoint-acceptance < /dev/null 2>&1 | tee publication.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-acceptance-log
          path: publication.log
          if-no-files-found: ignore
