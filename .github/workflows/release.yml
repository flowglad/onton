name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm64-apple-darwin
            runner: macos-14
          # Ubuntu 22.04 keeps the glibc baseline compatible with Daytona
          # containers created from ubuntu:22.04 images.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      # All build targets use GitHub-hosted runners.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # We deliberately do NOT cache [_opam/]. setup-ocaml@v3 caches its own
      # opam-root state at [~/.opam/]; caching the local switch alongside lets
      # the two drift — a stale [~/.opam/] without the switch registered makes
      # opam treat [_opam/] as a fresh switch and reinstall packages whose files
      # still exist on disk (the "zarith ... META already exists" failure). Worse
      # here: actions/cache freezes the first entry for a given `*.opam` hash, so
      # one half-consistent [_opam/] (e.g. from a cancelled run) poisons every
      # later run until the cache is manually evicted. CI's build-and-test job
      # sidesteps this with a Blacksmith sticky disk. [dune-cache: true]
      # plus the opam.ocaml.org archive mirror keep `opam install` fast.
      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: '5.5.0'
          dune-cache: true

      - name: Use opam.ocaml.org archive cache
        # erratique.ch (upstream for cmdliner, mtime, fpath, logs, uutf, ...)
        # is frequently flaky; the community cache mirrors opam-repository
        # archives behind a CDN, so opam only falls back to upstream on a miss.
        run: opam option 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install dependencies
        # Near-noop on a `_opam` cache hit: every dep is already present in the
        # switch, so opam just re-resolves and exits.
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build bin/main.exe bin/setsid_exec/main.exe

      - name: Package binary
        run: |
          mkdir -p _dist/bin
          cp _build/default/bin/main.exe _dist/bin/onton
          cp _build/default/bin/setsid_exec/main.exe _dist/bin/onton-setsid-exec
          test -x _dist/bin/onton
          test -x _dist/bin/onton-setsid-exec
          tar czf onton-${{ matrix.target }}.tar.gz \
            -C _dist/bin onton onton-setsid-exec
          test "$(tar tzf onton-${{ matrix.target }}.tar.gz | sort | tr '\n' ' ')" = \
            "onton onton-setsid-exec "

      - name: Smoke test in Ubuntu 22.04 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/_dist/bin:/dist:ro" ubuntu:22.04 \
            sh -c 'apt-get update -qq && apt-get install -y -qq libgmp10 >/dev/null && /dist/onton --version && /dist/onton-setsid-exec /bin/true'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onton-${{ matrix.target }}
          path: onton-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            onton-arm64-apple-darwin.tar.gz \
            onton-x86_64-unknown-linux-gnu.tar.gz \
            onton-aarch64-unknown-linux-gnu.tar.gz

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Compute SHA256 checksums
        id: sha
        run: |
          echo "arm64=$(shasum -a 256 onton-arm64-apple-darwin.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: useblacksmith/checkout@41cdeedae8edb2e684ba22896a5fd2a3cb85db6b # v4 (Blacksmith fork)
        with:
          ref: main

      - name: Generate and commit formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s/VERSION/$VERSION/g" \
              -e "s/SHA256_ARM64/${{ steps.sha.outputs.arm64 }}/g" \
              Formula/onton.rb.template > Formula/onton.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/onton.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Formula: onton ${GITHUB_REF_NAME}"
          git push origin main
